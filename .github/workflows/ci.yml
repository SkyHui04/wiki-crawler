name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Verify locked dependencies
        run: |
          uv pip compile \
            pyproject.toml \
            --extra test \
            --extra dev \
            --output-file check_requirements.txt \
            --no-header

          diff --strip-trailing-cr -- requirements.txt check_requirements.txt

      - name: Install dependencies
        run: |
          uv pip install \
            --requirement requirements.txt

          uv pip install \
            --no-deps .

      - name: Format
        run: black --check .

      - name: Lint
        run: ruff check .

      - name: Run unit tests
        run: pytest -v

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting and lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Build frontend
        run: npm run build

  schema:
    name: Synchronize schemas
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Install backend dependencies
        working-directory: backend
        run: |
          uv pip install \
            --requirement requirements.txt

          uv pip install \
            --no-deps .

      - name: Synchronize schemas
        run: bash tools/sync-schemas.sh

      - name: Check for generated-file changes
        run: git diff --exit-code -- frontend/src/types/api
